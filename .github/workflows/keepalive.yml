name: Keepalive

# Consulta ligera cada 3 días para que el proyecto gratuito de Supabase no se pause.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a public.keepalive()
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan los secrets de Actions VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --output /dev/null -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
